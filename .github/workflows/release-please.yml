name: release-please

# Release PR и CHANGELOG для dev. Версию двигают только feat/fix/breaking
# (CONTRIBUTING.md): release-please собирает их в один PR, который владелец
# мержит вручную. Токен - fine-grained PAT RELEASE_PLEASE_TOKEN, иначе PR,
# созданный GITHUB_TOKEN, не запускает собственные проверки и его нельзя
# смержить (см. README, раздел «Release-please»).
on:
  push:
    branches:
      - dev

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # Отдельный шаг без модели: причина `infra` видна сразу, а не как
      # непонятный отказ экшена внутри release-please.
      - name: Preflight - токен release-please
        id: preflight
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::Причина infra: секрет RELEASE_PLEASE_TOKEN не задан. Создайте fine-grained PAT с правами Contents R/W, Pull requests R/W, Issues R/W и добавьте его в Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Release please
        if: steps.preflight.outputs.ok == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # googleapis/release-please-action v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
