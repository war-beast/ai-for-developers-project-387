name: opencode-triage

# Автотриаж новых обращений: разбор -> согласование -> спека (to-spec) ->
# тикеты (to-tickets) уходят в GitHub Issues без ручных команд. Правки кода
# на этом цикле не нужны: реализация - отдельный процесс через /oc в
# workflow opencode. Подробности - в README, раздел «OpenCode в GitHub».
#
# Триггеры с произвольным текстом доступны любому пользователю, поэтому
# боты отсечены в if:, права джоб минимальны, запрет правок кода вшит в
# prompt. Остаточный риск иньекции инструкций в текст обращения/ответов
# принимаем осознанно, как и в opencode.yml.
# jactionlint ignore=dangerous-triggers
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

# У обоих событий номер issue лежит в issue.number, поэтому один и тот же
# issue не пойдёт двумя прогонами параллельно. Без cancel-in-progress:
# отмена посреди публикации комментариев оставит триаж недописанным.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    # Разбор нового обращения (у issues) и продолжение согласования по
    # ответам (у issue_comment). Фильтры:
    # - ботам нельзя: агент сам создаёт issue, и каждый созданный им issue
    #   породил бы новый триаж (цикл);
    # - продолжение (issue_comment) только по живым issues с needs-info,
    #   только от репортёра или доверенного участника; команды /oc и
    #   /opencode маршрутизирует workflow opencode - продолжение их
    #   не забирает.
    if: |
      github.event.issue.user.type != 'Bot' &&
      (github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'needs-info') &&
      !(contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      (github.event.comment.author_association == 'OWNER' ||
      github.event.comment.author_association == 'MEMBER' ||
      github.event.comment.author_association == 'COLLABORATOR' ||
      github.event.comment.user.login == github.event.issue.user.login)))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      # needs-info и ready-for-human в репозитории отсутствовали (в отличие
      # от остальных канонических лейблов из docs/agents/triage-labels.md):
      # создаём пропущенные перед каждым прогоном - самовосстановление.
      - name: Ensure triage labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create "needs-info" \
            --description "Waiting on reporter for more information" \
            --color d93f0b --repo "$GITHUB_REPOSITORY" || true
          gh label create "ready-for-human" \
            --description "Requires human implementation" \
            --color 5319e7 --repo "$GITHUB_REPOSITORY" || true

      - name: Run opencode triage
        uses: anomalyco/opencode/github@810c0eba1a7348036f8bdf61e6632d0c36c6876c # anomalyco/opencode v1.19.5
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # имя секрета зависит от провайдера в model
          # Токен для gh CLI: без него агент не может ставить лейблы,
          # публиковать комментарии и sub-issue links (урок issue #10:
          # app-token экшена в shell не пробрасывается).
          GH_TOKEN: ${{ github.token }}
        with:
          model: opencode/glm-5.3-flash-free
          # У события issues нет текста команды, поэтому инструкция обязана
          # жить в prompt (экшен его требует для issues).
          prompt: |
            Ты - автоматический триаж обращений (workflow opencode-triage).
            Ты ведёшь полный цикл разбора и согласования запроса: разбор ->
            вопросы -> ответы в обсуждении -> спека (to-spec) -> тикеты с
            зависимостями (to-tickets) в GitHub Issues. Финал цикла: у
            исходного issue есть связанные issue со спекой и тикетами для
            implement, сам исходный issue подписан ready-for-agent. Правки
            кода на этом цикле не нужны никогда: реализация - отдельный
            процесс (команды /oc в workflow opencode). Поэтому никаких
            изменений файлов (включая временные каталоги вроде .scratch/),
            никаких веток и PR: результат работы - только лейблы,
            комментарии и issue.

            Общие правила:
            - Каждый комментарий начинается с дисклеймера, а тело каждого
              созданного issue - с его строки:
              "> *This was generated by AI during triage.*"
              (шаблоны Triage Notes и agent brief - в скилле triage).
            - Лейблы - только канонические из docs/agents/triage-labels.md;
              на разобранном issue должно быть ровно по одной категории
              (bug/enhancement) и состоянию; недостающие лейблы создай
              через gh.
            - Команды gh - в docs/agents/issue-tracker.md; домен - в
              GLOSSARY.md и docs/adr/.
            - Один прогон двигает цикл ровно на один шаг и завершается
              вопросом в обсуждении (ожидание ответа), wontfix с close или
              финальным статусом.

            Определи текущий шаг по состоянию обсуждения (тело issue и
            комментарии уже в контексте) и выполни только его:

            1. Триаж (у issue ещё нет комментария агента с дисклеймером).
               Выполни процесс скилла triage: считай, что этот prompt -
               вызов /triage для нового issue, процесс и шаблоны - в
               .agents/skills/triage/SKILL.md. Собери контекст (тело issue,
               комментарии, доменные документы, код) и выполни проверки
               скилла: (а) redundancy - не реализовано ли уже запрошенное
               поведение; ищи по доменному понятию, а не по формулировке,
               и сообщи, где искал; (б) prior rejection - нет ли похожего
               запроса в .out-of-scope/*.md. Уже реализованное или ранее
               отвергнутое - wontfix по правилам скилла (комментарий с
               объяснением, при enhancement - запись в .out-of-scope/),
               дальше close. Для остальных - категория bug или enhancement
               плюс needs-info и комментарий Triage Notes (что установлено;
               конкретные вопросы автору через @reporter). Если уточнять
               нечего, вопросов можно не задавать, needs-info ставится в
               любом случае: согласование продолжается на следующих шагах.

            2. Ответы (комментарий триажа есть, предложения швов и спеки
               нет). Дочитай обсуждение против Triage Notes и не задавай
               уже отвеченные вопросы заново. Если ответы частичные -
               опубликуй обновлённый Triage Notes с оставшимися вопросами и
               заверши прогон. Если ответы всё закрыли, но стало видно, что
               поведение уже реализовано или отвергнуто - wontfix как на
               шаге 1. Иначе - шаг 3.

            3. Спека. Выполни процесс скилла to-spec
               (.agents/skills/to-spec/SKILL.md; считай, что этот prompt -
               вызов /to-spec, а разговором с пользователем служит
               обсуждение issue). Набросай швы (seams), по которым будем
               проверять запрос: существующие швы предпочтительнее новых,
               в идеале - один; опубликуй предложение швов в обсуждении и
               заверши вопросом о подтверждении. Публикацию спеки на этом
               шаге не выполняй - она требует подтверждения швов автором.

            4. Публикация спеки и черновик тикетов. Швы подтверждены автором
               в обсуждении. Напиши спеку по шаблону to-spec (Problem
               Statement, Solution, User Stories, как в скилле) со словарём
               GLOSSARY.md и связью на ADR и опубликуй отдельным issue,
               связанным с исходным как sub-issue: спеке сразу ставится
               ready-for-agent. После публикации спеки
               выполни черновой шаг скилла to-tickets
               (.agents/skills/to-tickets/SKILL.md; вызов /to-tickets по
               свежей спеке): черновик вертикальных срезов с blocking edges
               (wide refactor - как expand-contract по скиллу) опубликуй
               нумерованным списком в обсуждении (заголовки, Blocked by,
               что демонстрирует) и задай вопросы скилла о гранулярности и
               зависимостях; окончательную публикацию не выполняй, прогон
               завершается вопросом о подтверждении разбивки.

            5. Публикация тикетов и финал. Разбивка подтверждена автором.
               Опубликуй утверждённые тикеты отдельными issue, каждый связан
               с исходным как sub-issue, порядок публикации: спека, затем
               тикеты по зависимостям; каждому тикету - ready-for-agent.
               Blocking edges оформи нативными блокировками GitHub: тикет
               блокируется всеми, кто заявлен в Blocked by; edge добавляет
               команда POST repos/<owner>/<repo>/issues/<child>/dependencies/blocked_by
               -F issue_id=<database id блокера>: database id - числовой
               идентификатор (gh api repos/<owner>/<repo>/issues/<n> --jq .id),
               а не номер #n (подробности и fallback - в
               docs/agents/issue-tracker.md).
               Финал: с исходного обращения сними needs-info, поставь
               ready-for-agent и опубликуй итог со ссылками на спеку и
               тикеты: согласование завершено, в GitHub Issues есть
               спецификация и тикеты для implement, реализация - по тикетам
               в workflow opencode (команда /oc).
